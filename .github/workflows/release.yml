name: Release Builder

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build and Package Release
    runs-on: windows-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (frozen lockfile)
        run: |
          uv sync --frozen --extra dev
          uv pip install pyinstaller

      - name: Compile locales (.po -> .mo)
        run: uv run python scripts/compile_locales.py

      - name: Generate CycloneDX SBOM (from uv.lock)
        # ReAct fix: deterministic lockfile-driven SBOM instead of
        # environment introspection.
        run: |
          uv run python scripts/generate_sbom.py
          cp packaging/sbom.cdx.json sbom.json

      - name: Build Executable via PyInstaller
        run: |
          uv run pyinstaller gesture_controller.spec --noconfirm

      - name: Code Sign (Windows)
        shell: powershell
        run: |
          # Azure Key Vault Code Signing simulation/placeholder
          if ("${{ secrets.AZURE_CLIENT_ID }}" -ne "") {
            echo "Running Azure SignTool..."
            # dotnet tool install --global SignTool
            # signtool sign-svs ...
          } else {
            echo "Skipping Windows signing: Secrets not configured."
          }

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      # ReAct fix: spec outputs dist/GestureController/GestureController.exe
      # (COLLECT dir), not dist/Maestro.exe. Sign + hash the real binary.
      - name: Sign Executable with Cosign (Keyless)
        shell: pwsh
        run: |
          $exe = "dist/GestureController/GestureController.exe"
          if (-not (Test-Path $exe)) { Write-Error "Expected binary missing: $exe"; exit 1 }
          cosign sign-blob --yes --output-signature "$exe.sig" --output-certificate "$exe.pem" "$exe"

      - name: Generate Hashes for SLSA Generic Generator
        id: hash
        shell: pwsh
        run: |
          $exe = "dist/GestureController/GestureController.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $subject = "$hash  GestureController.exe"
          $base64 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($subject))
          echo "hashes=$base64" >> $env:GITHUB_OUTPUT

      - name: Upload SBOM and Binaries
        uses: actions/upload-artifact@v4
        with:
          name: Maestro-Windows-Artifacts
          path: |
            dist/GestureController/
            sbom.json

  # ReAct fix: the project claims Windows/macOS/Linux support but only
  # shipped Windows artifacts. These jobs build the same PyInstaller spec
  # on each OS. (Notarization, .dmg, and deb/rpm remain future work.)
  build-linux:
    name: Build Release (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 gettext

      - name: Install dependencies (frozen lockfile)
        run: |
          uv sync --frozen --extra dev
          uv pip install pyinstaller

      - name: Compile locales (.po -> .mo)
        run: uv run python scripts/compile_locales.py

      - name: Build Executable via PyInstaller
        run: uv run pyinstaller gesture_controller.spec --noconfirm

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: Maestro-Linux-Artifacts
          path: dist/GestureController/

  build-macos:
    name: Build Release (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (frozen lockfile)
        run: |
          uv sync --frozen --extra dev
          uv pip install pyinstaller

      # NOTE: no gettext install needed — scripts/compile_locales.py falls
      # back to its self-contained .po -> .mo compiler.
      - name: Compile locales (.po -> .mo)
        run: uv run python scripts/compile_locales.py

      - name: Build Executable via PyInstaller
        run: uv run pyinstaller gesture_controller.spec --noconfirm

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: Maestro-macOS-Artifacts
          path: dist/

  provenance:
    needs: build
    name: Generate SLSA Build Provenance
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.9.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true
