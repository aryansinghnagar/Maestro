name: Nightly Fuzzing

on:
  schedule:
    - cron: '0 2 * * *'  # Runs nightly at 2:00 AM UTC
  workflow_dispatch:      # Allows manual trigger

permissions:
  contents: read

jobs:
  fuzz:
    name: Run Fuzzing Targets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (frozen lockfile)
        run: |
          uv sync --frozen --extra dev
          uv pip install atheris

      - name: Run Fuzz Target
        # ReAct fix: fail-closed. The previous `|| echo` masked fuzzer
        # crashes (the exact signal fuzzing exists to surface). Atheris
        # exits 0 on clean timeout-expiry and non-zero on findings, so a
        # bare invocation is the correct gate.
        run: |
          # Run the fuzz target for 10 minutes (600 seconds)
          uv run python gesture_controller/tests/fuzz/fuzz_compile_condition.py -max_total_time=600
