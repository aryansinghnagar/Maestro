name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify CI workflow triggers on main
        run: |
          python -c "
          import yaml
          with open('.github/workflows/ci.yml') as f:
              w = yaml.safe_load(f)
          on = w['on'] if 'on' in w else w[True]
          push_branches = on.get('push', {}).get('branches', [])
          pr_branches = on.get('pull_request', {}).get('branches', [])
          assert 'main' in push_branches, f'push.branches must contain main, got {push_branches}'
          assert 'main' in pr_branches, f'pull_request.branches must contain main, got {pr_branches}'
          print('CI workflow trigger validation passed!')
          "

  npm-quality:
    name: npm Quality & Test (Node.js)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        # ReAct fix: fail-closed (was `|| npm install`, which masked lockfile drift).
        run: npm ci

      - name: Run Biome Linter & Formatter Check
        # ReAct fix: fail-closed (was `|| npm run lint:js`, which masked failures).
        run: npx @biomejs/biome check .

      - name: Run JS Unit Tests
        run: npm test

  lint-and-typecheck:
    name: Lint & Typecheck (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # ReAct fix: uv.lock is now authoritative (was `pip install -e .[dev]`,
      # which ignored the lock and left the CVE window open).
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Dependencies (frozen lockfile)
        run: uv sync --frozen --extra dev

      - name: Verify SBOM freshness
        run: uv run python scripts/generate_sbom.py --check

      - name: Run Black Formatter Check
        run: uv run black --check gesture_controller/

      - name: Run Mypy Type Checking
        run: uv run mypy gesture_controller/

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Dependencies (frozen lockfile)
        run: |
          uv sync --frozen --extra dev
          uv pip install pip-audit bandit

      - name: Run Bandit (MEDIUM+ only)
        run: uv run bandit -r gesture_controller/ -x gesture_controller/tests/ -ll -q

      - name: Run Pip-Audit
        # Audit fix MAE-SEC-009: removed ``|| true`` so CVE findings fail
        # the build. Previously the ``|| true`` masked all SCA findings,
        # which meant any dependency CVE (in ``mediapipe``, ``onnxruntime``,
        # ``tuf``, ``pywin32``, ``pyobjc``, etc.) would not block merges
        # or releases. If a known-vulnerable dependency is acceptable for
        # a specific reason, suppress it explicitly via ``--ignore-vuln``
        # rather than masking the entire step.
        # ReAct fix: run inside the frozen uv environment.
        run: uv run pip-audit . --strict --skip-editable

  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up headless display and GPU libs (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb \
            portaudio19-dev libasound2-dev \
            libegl1 libgl1 libgles2 \
            libglib2.0-0 libfontconfig1 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0
          echo "DISPLAY=:99" >> $GITHUB_ENV
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &

      - name: Install Dependencies (frozen lockfile)
        run: uv sync --frozen --extra dev

      - name: Compile locales (.po -> .mo)
        # ReAct fix: i18n ships 0 .mo files on fresh clones; generate them
        # here so language tests exercise the real gettext path.
        run: uv run python scripts/compile_locales.py

      - name: Run pywin32 post-install (Windows only)
        # ReAct fix: fail-closed (was `|| true`, masking broken pywin32).
        if: matrix.os == 'windows-latest'
        run: uv run python -c "import win32api"

      - name: Run Test Suite
        # Audit fix MAE-SEC-010: removed ``|| true`` so test failures fail
        # the build. Previously the ``|| true`` masked all pytest failures,
        # which meant broken tests could ship to release. The artifact
        # upload step below uses ``if: always()`` so the junit XML is
        # preserved even on failure.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run python -m pytest -m "not real_mediapipe and not requires_hardware and not slow" --cov=gesture_controller --junitxml=pytest.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}-${{ matrix.python-version }}
          path: pytest.xml
          retention-days: 7

      - name: Upload coverage to Codecov
        # ReAct fix: fail-closed so silent coverage outages surface.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: true
